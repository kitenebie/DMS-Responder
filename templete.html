<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Responder Mobile Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        box-sizing: border-box;
      }
      * {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .status-pending {
        background-color: #6b7280;
      }
      .status-ongoing {
        background-color: #3b82f6;
      }
      .status-arrived {
        background-color: #22c55e;
      }
      .status-completed {
        background-color: #10b981;
      }
      .status-cancelled {
        background-color: #ef4444;
      }
      .status-duplicate {
        background-color: #f97316;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out;
      }
      .animate-slideUp {
        animation: slideUp 0.3s ease-out;
      }
      .animate-pulse {
        animation: pulse 2s infinite;
      }

      .map-container {
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        position: relative;
        overflow: hidden;
      }
      .map-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
      }
      .map-roads {
        position: absolute;
        inset: 0;
      }
      .incident-marker {
        position: absolute;
        width: 40px;
        height: 40px;
        transform: translate(-50%, -50%);
      }
      .marker-pulse {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.3);
        animation: pulse 2s infinite;
        transform: translate(-50%, -50%);
      }
    </style>
    <style>
      @view-transition {
        navigation: auto;
      }
    </style>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  </head>
  <body class="h-full bg-slate-900 text-white overflow-hidden">
    <div id="app" class="h-full w-full flex flex-col"></div>
    <script>
      // ==================== MOCK DATA ====================
      const MOCK_INCOMING_INCIDENT = {
        id: "INC-2024-0847",
        type: "Medical Emergency",
        location: "1247 Oak Street, Downtown",
        coordinates: { lat: 40.7128, lng: -74.006 },
        timeReported: new Date().toISOString(),
        description:
          "Elderly person collapsed. Possible cardiac event. Bystander performing CPR.",
        priority: "High",
        caller: "John Smith",
        callerPhone: "(555) 123-4567",
      };

      const MOCK_HISTORICAL_INCIDENTS = [
        {
          id: "INC-2024-0846",
          type: "Traffic Accident",
          location: "789 Highway 101, Exit 23",
          timeReported: "2024-01-15T14:30:00Z",
          status: "Completed",
          responder: "Unit 12",
          description: "Minor fender bender, no injuries",
        },
        {
          id: "INC-2024-0845",
          type: "Fire - Residential",
          location: "456 Maple Avenue",
          timeReported: "2024-01-15T10:15:00Z",
          status: "Completed",
          responder: "Unit 7",
          description: "Kitchen fire, contained quickly",
        },
        {
          id: "INC-2024-0844",
          type: "Medical Emergency",
          location: "321 Park Boulevard",
          timeReported: "2024-01-14T22:45:00Z",
          status: "Cancelled",
          responder: "Unit 12",
          description: "False alarm - patient refused service",
        },
        {
          id: "INC-2024-0843",
          type: "Assault",
          location: "555 Main Street",
          timeReported: "2024-01-14T18:20:00Z",
          status: "Completed",
          responder: "Unit 3",
          description: "Verbal altercation, parties separated",
        },
        {
          id: "INC-2024-0842",
          type: "Medical Emergency",
          location: "888 River Road",
          timeReported: "2024-01-14T09:00:00Z",
          status: "Duplicate",
          responder: "Unit 12",
          description: "Duplicate report of INC-2024-0841",
        },
      ];

      const MOCK_CHAT_MESSAGES = [
        {
          id: 1,
          sender: "Dispatch",
          message: "Unit 12, please confirm your status.",
          time: "14:32",
          isUser: false,
        },
        {
          id: 2,
          sender: "Unit 12",
          message: "Unit 12 en route to location.",
          time: "14:33",
          isUser: true,
        },
        {
          id: 3,
          sender: "Dispatch",
          message: "Copy that. EMS is also en route, ETA 8 minutes.",
          time: "14:34",
          isUser: false,
        },
        {
          id: 4,
          sender: "Unit 12",
          message: "Understood. Will coordinate on scene.",
          time: "14:35",
          isUser: true,
        },
        {
          id: 5,
          sender: "Dispatch",
          message: "Update: Bystander reports victim is conscious now.",
          time: "14:37",
          isUser: false,
        },
      ];

      const STATUS_FLOW = [
        "Pending",
        "Ongoing",
        "Arrived",
        "Duplicate",
        "Cancelled",
        "Completed",
      ];

      const STATUS_COLORS = {
        Pending: "bg-gray-500",
        Ongoing: "bg-blue-500",
        Arrived: "bg-green-500",
        Completed: "bg-emerald-500",
        Cancelled: "bg-red-500",
        Duplicate: "bg-orange-500",
      };

      // ==================== DEFAULT CONFIG ====================
      const defaultConfig = {
        app_title: "Responder Interface",
        responder_name: "Unit 12",
        primary_color: "#3B82F6",
        secondary_color: "#1E293B",
        accent_color: "#10B981",
        text_color: "#F8FAFC",
        background_color: "#0F172A",
      };

      // Theme configurations
      const themes = {
        dark: {
          background: "#0F172A",
          surface: "#1E293B",
          surfaceAlt: "#334155",
          text: "#F8FAFC",
          textSecondary: "#94A3B8",
          border: "#334155",
          mapBg:
            "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
        },
        light: {
          background: "#F8FAFC",
          surface: "#FFFFFF",
          surfaceAlt: "#E2E8F0",
          text: "#0F172A",
          textSecondary: "#475569",
          border: "#CBD5E1",
          mapBg:
            "linear-gradient(135deg, #E0E7FF 0%, #DBEAFE 50%, #BFDBFE 100%)",
        },
      };

      // ==================== APPLICATION STATE ====================
      let state = {
        showIncomingModal: true,
        activeIncident: null,
        currentStatus: "Pending",
        isMapFullscreen: false,
        showChat: false,
        showHistory: false,
        isDarkMode: true,
        chatMessages: [...MOCK_CHAT_MESSAGES],
        newMessage: "",
        historySearch: "",
        historyFilter: { type: "all", status: "all" },
        reportForm: {
          actionsTaken: "",
          timeArrived: "",
          timeCompleted: "",
          additionalNotes: "",
        },
      };

      // ==================== ELEMENT SDK SETUP ====================
      const elementApi = {
        defaultConfig,
        onConfigChange: async (config) => {
          renderApp();
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) =>
                window.elementSdk.setConfig({ primary_color: value }),
            },
            {
              get: () =>
                config.background_color || defaultConfig.background_color,
              set: (value) =>
                window.elementSdk.setConfig({ background_color: value }),
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) =>
                window.elementSdk.setConfig({ accent_color: value }),
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) =>
                window.elementSdk.setConfig({ text_color: value }),
            },
            {
              get: () =>
                config.secondary_color || defaultConfig.secondary_color,
              set: (value) =>
                window.elementSdk.setConfig({ secondary_color: value }),
            },
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined,
        }),
        mapToEditPanelValues: (config) =>
          new Map([
            ["app_title", config.app_title || defaultConfig.app_title],
            [
              "responder_name",
              config.responder_name || defaultConfig.responder_name,
            ],
          ]),
      };

      if (window.elementSdk) {
        window.elementSdk.init(elementApi);
      }

      // ==================== HELPER FUNCTIONS ====================
      function getConfig() {
        return window.elementSdk?.config || defaultConfig;
      }

      function getTheme() {
        return state.isDarkMode ? themes.dark : themes.light;
      }

      function formatTime(isoString) {
        const date = new Date(isoString);
        return date.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      // ==================== EVENT HANDLERS ====================
      function acceptIncident() {
        state.showIncomingModal = false;
        state.activeIncident = { ...MOCK_INCOMING_INCIDENT };
        state.currentStatus = "Pending";
        renderApp();
      }

      function dismissIncident() {
        state.showIncomingModal = false;
        renderApp();
      }

      function updateStatus(newStatus) {
        state.currentStatus = newStatus;
        renderApp();
      }

      function toggleMapFullscreen() {
        state.isMapFullscreen = !state.isMapFullscreen;
        renderApp();
      }

      function restoreMapSize() {
        state.isMapFullscreen = false;
        renderApp();
      }

      function toggleChat() {
        state.showChat = !state.showChat;
        renderApp();
      }

      function toggleHistory() {
        state.showHistory = !state.showHistory;
        renderApp();
      }

      function toggleTheme() {
        state.isDarkMode = !state.isDarkMode;
        renderApp();
      }

      function sendMessage() {
        if (state.newMessage.trim()) {
          state.chatMessages.push({
            id: state.chatMessages.length + 1,
            sender: getConfig().responder_name,
            message: state.newMessage,
            time: new Date().toLocaleTimeString("en-US", {
              hour: "2-digit",
              minute: "2-digit",
            }),
            isUser: true,
          });
          state.newMessage = "";
          renderApp();
          // Scroll to bottom of chat
          setTimeout(() => {
            const chatContainer = document.getElementById("chat-messages");
            if (chatContainer)
              chatContainer.scrollTop = chatContainer.scrollHeight;
          }, 50);
        }
      }

      function updateReportForm(field, value) {
        state.reportForm[field] = value;
      }

      function submitReport() {
        // Mock submit - just show confirmation
        const reportSection = document.getElementById("report-section");
        if (reportSection) {
          const confirmMsg = document.createElement("div");
          confirmMsg.className =
            "fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg animate-slideUp z-50";
          confirmMsg.textContent = "Report submitted successfully!";
          document.body.appendChild(confirmMsg);
          setTimeout(() => confirmMsg.remove(), 3000);
        }
      }

      function filterHistory() {
        let filtered = [...MOCK_HISTORICAL_INCIDENTS];

        if (state.historySearch) {
          const search = state.historySearch.toLowerCase();
          filtered = filtered.filter(
            (inc) =>
              inc.id.toLowerCase().includes(search) ||
              inc.type.toLowerCase().includes(search) ||
              inc.location.toLowerCase().includes(search) ||
              inc.description.toLowerCase().includes(search),
          );
        }

        if (state.historyFilter.type !== "all") {
          filtered = filtered.filter(
            (inc) => inc.type === state.historyFilter.type,
          );
        }

        if (state.historyFilter.status !== "all") {
          filtered = filtered.filter(
            (inc) => inc.status === state.historyFilter.status,
          );
        }

        return filtered;
      }

      // ==================== RENDER FUNCTIONS ====================
      function renderMap() {
        const config = getConfig();
        const theme = getTheme();
        const mapHeight = state.isMapFullscreen ? "h-full" : "h-64";
        const incident = state.activeIncident;

        return `
        <div class="map-container ${mapHeight} w-full relative transition-all duration-300 rounded-lg overflow-hidden" style="background: ${theme.mapBg}">
          <div class="map-grid"></div>
          
          <!-- SVG Roads -->
          <svg class="map-roads" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
            <!-- Main roads -->
            <path d="M0 150 L400 150" stroke="${state.isDarkMode ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.15)"}" stroke-width="8" fill="none"/>
            <path d="M200 0 L200 300" stroke="${state.isDarkMode ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.15)"}" stroke-width="8" fill="none"/>
            <path d="M50 0 L350 300" stroke="${state.isDarkMode ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"}" stroke-width="4" fill="none"/>
            <path d="M350 0 L50 300" stroke="${state.isDarkMode ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"}" stroke-width="4" fill="none"/>
            
            <!-- Secondary roads -->
            <path d="M0 75 L400 75" stroke="${state.isDarkMode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)"}" stroke-width="3" fill="none"/>
            <path d="M0 225 L400 225" stroke="${state.isDarkMode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)"}" stroke-width="3" fill="none"/>
            <path d="M100 0 L100 300" stroke="${state.isDarkMode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)"}" stroke-width="3" fill="none"/>
            <path d="M300 0 L300 300" stroke="${state.isDarkMode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)"}" stroke-width="3" fill="none"/>
            
            <!-- Buildings -->
            <rect x="120" y="100" width="30" height="25" fill="${state.isDarkMode ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"}" rx="2"/>
            <rect x="250" y="180" width="40" height="30" fill="${state.isDarkMode ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"}" rx="2"/>
            <rect x="320" y="80" width="35" height="40" fill="${state.isDarkMode ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"}" rx="2"/>
            <rect x="60" y="200" width="25" height="35" fill="${state.isDarkMode ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"}" rx="2"/>
          </svg>
          
          ${
            incident
              ? `
            <!-- Incident Marker -->
            <div class="incident-marker" style="top: 55%; left: 48%;">
              <div class="marker-pulse"></div>
              <svg width="40" height="40" viewBox="0 0 40 40" class="relative z-10">
                <circle cx="20" cy="20" r="16" fill="#EF4444" stroke="#fff" stroke-width="3"/>
                <path d="M20 10 L20 22 M20 26 L20 28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            
            <!-- Location Label -->
            <div class="absolute bottom-12 left-4 backdrop-blur-sm px-3 py-2 rounded-lg text-sm" style="background-color: ${theme.surface}CC; color: ${theme.text}">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-red-400" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                </svg>
                <span style="color: ${theme.text}">${incident.location}</span>
              </div>
            </div>
          `
              : `
            <div class="absolute inset-0 flex items-center justify-center">
              <p class="text-lg" style="color: ${theme.textSecondary}">No Active</p>
            </div>
          `
          }
          
          <!-- Map Controls -->
          <div class="absolute bottom-4 right-4 flex flex-col gap-2">
            <button onclick="toggleMapFullscreen()" class="w-10 h-10 backdrop-blur-sm rounded-lg flex items-center justify-center hover:opacity-80 transition-opacity" style="background-color: ${theme.surface}E6; color: ${theme.text}">
              ${
                state.isMapFullscreen
                  ? `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              `
                  : `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
              `
              }
            </button>
            ${
              state.isMapFullscreen
                ? `
              <button onclick="restoreMapSize()" class="w-10 h-10 backdrop-blur-sm rounded-lg flex items-center justify-center hover:opacity-80 transition-opacity" style="background-color: ${theme.surface}E6; color: ${theme.text}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
                </svg>
              </button>
            `
                : ""
            }
          </div>
        </div>
      `;
      }

      function renderIncomingModal() {
        const config = getConfig();
        const incident = MOCK_INCOMING_INCIDENT;

        return `
        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div class="bg-slate-800 rounded-2xl w-full max-w-md shadow-2xl animate-fadeIn border border-slate-700">
            <!-- Header -->
            <div class="bg-red-600 px-6 py-4 rounded-t-2xl">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center animate-pulse">
                  <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                  </svg>
                </div>
                <div>
                  <h2 class="text-xl font-bold text-white">Incoming Incident Report</h2>
                  <p class="text-red-100 text-sm">Priority: ${incident.priority}</p>
                </div>
              </div>
            </div>
            
            <!-- Content -->
            <div class="p-6 space-y-4">
              <div class="bg-slate-700/50 rounded-xl p-4">
                <div class="flex items-center gap-2 mb-2">
                  <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                    <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
                  </svg>
                  <span class="text-gray-400 text-sm">Incident ID</span>
                </div>
                <p class="text-white font-semibold">${incident.id}</p>
              </div>
              
              <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-700/50 rounded-xl p-4">
                  <div class="flex items-center gap-2 mb-2">
                    <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M17.707 9.293a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A.997.997 0 012 10V5a3 3 0 013-3h5c.256 0 .512.098.707.293l7 7zM5 6a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
                    </svg>
                    <span class="text-gray-400 text-sm">Type</span>
                  </div>
                  <p class="text-white font-semibold text-sm">${incident.type}</p>
                </div>
                
                <div class="bg-slate-700/50 rounded-xl p-4">
                  <div class="flex items-center gap-2 mb-2">
                    <svg class="w-5 h-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                    </svg>
                    <span class="text-gray-400 text-sm">Time</span>
                  </div>
                  <p class="text-white font-semibold text-sm">${formatTime(incident.timeReported)}</p>
                </div>
              </div>
              
              <div class="bg-slate-700/50 rounded-xl p-4">
                <div class="flex items-center gap-2 mb-2">
                  <svg class="w-5 h-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                  </svg>
                  <span class="text-gray-400 text-sm">Location</span>
                </div>
                <p class="text-white font-semibold">${incident.location}</p>
              </div>
              
              <div class="bg-slate-700/50 rounded-xl p-4">

      function renderStatusTracker() {
        if (!state.activeIncident) return "";

        const theme = getTheme();
        const currentIndex = STATUS_FLOW.indexOf(state.currentStatus);

        return `
        <div class="rounded-xl p-4" style="background-color: ${theme.surface}; border: 1px solid ${theme.border}">
          <h3 class="text-lg font-bold mb-6 flex items-center gap-2" style="color: ${theme.text}">
            <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
            </svg>
            Status Timeline
          </h3>
          
          <div class="relative">
            <!-- Timeline Line (centered) -->
            <div class="absolute left-1/2 transform -translate-x-1/2 top-0 bottom-0 w-0.5" style="background-color: ${theme.border}"></div>
            
            <!-- Timeline Items -->
            <div class="space-y-8">
              ${STATUS_FLOW.map((status, index) => {
                const isActive = state.currentStatus === status;
                const isPassed = index < currentIndex;
                const colorClass = STATUS_COLORS[status];
                const isLeft = index % 2 === 0; // Alternate: even indices on left, odd on right

                // Icon based on status
                let icon = "";
                if (status === "Pending") {
                  icon =
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>';
                } else if (status === "Ongoing") {
                  icon =
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>';
                } else if (status === "Arrived") {
                  icon =
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>';
                } else if (status === "Completed") {
                  icon =
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
                } else if (status === "Cancelled") {
                  icon =
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
                } else if (status === "Duplicate") {
                  icon =
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>';
                }

                return `
                  <div class="relative flex items-center ${isLeft ? "flex-row" : "flex-row-reverse"} gap-4 group">
                    <!-- Timeline Content -->
                    <div class="w-[calc(50%-2rem)]">
                      <button
                        onclick="updateStatus('${status}')"
                        class="text-${isLeft ? "right" : "left"} w-full rounded-lg px-4 py-3 transition-all duration-200 ${isActive ? "ring-2" : "hover:scale-102"}"
                        style="${isActive ? `background-color: ${colorClass.replace("bg-", "#")}20; ring-color: ${colorClass.replace("bg-", "#")}; border: 1px solid ${colorClass.replace("bg-", "#")};` : `background-color: ${theme.surfaceAlt}; border: 1px solid ${theme.border};`}"
                      >
                        <div class="flex items-center ${isLeft ? "justify-end" : "justify-start"} gap-3">
                          ${
                            isLeft && isActive
                              ? `
                            <div class="animate-pulse">
                              <svg class="w-6 h-6" style="color: ${colorClass.replace("bg-", "#")}" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd"/>
                              </svg>
                            </div>
                          `
                              : ""
                          }
                          <div>
                            <h4 class="font-semibold ${isActive ? "text-lg" : "text-base"}" style="color: ${isActive ? colorClass.replace("bg-", "#") : theme.text}">
                              ${status}
                            </h4>
                            <p class="text-xs mt-0.5" style="color: ${theme.textSecondary}">
                              ${isPassed ? "Completed" : isActive ? "Current Status" : "Pending"}
                            </p>
                          </div>
                          ${
                            !isLeft && isActive
                              ? `
                            <div class="animate-pulse">
                              <svg class="w-6 h-6" style="color: ${colorClass.replace("bg-", "#")}" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd"/>
                              </svg>
                            </div>
                          `
                              : ""
                          }
                        </div>
                      </button>
                    </div>
                    
                    <!-- Timeline Node (centered) -->
                    <button
                      onclick="updateStatus('${status}')"
                      class="relative z-10 w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 flex-shrink-0 ${isActive ? "scale-125 ring-4" : "hover:scale-110"} ${isPassed ? "opacity-60" : ""}"
                      style="background-color: ${isActive || isPassed ? colorClass.replace("bg-", "#") : theme.surfaceAlt}; ${isActive ? `box-shadow: 0 0 20px ${colorClass.replace("bg-", "#")}40; ring-color: ${colorClass.replace("bg-", "#")}40;` : ""}"
                    >
                      ${
                        isActive
                          ? `
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          ${icon}
                        </svg>
                      `
                          : isPassed
                            ? `
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                      `
                            : `
                        <div class="w-2 h-2 rounded-full" style="background-color: ${theme.border}"></div>
                      `
                      }
                    </button>
                    
                    <!-- Empty space for alternating layout -->
                    <div class="w-[calc(50%-2rem)]"></div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
      }

                </button>
              </div>
            </div>
          </div>
        </div>
      `;

                <label class="block text-sm text-gray-400 mb-2">Time Completed</label>

      // ==================== MAIN RENDER ====================
      function renderApp() {
        const config = getConfig();
        const theme = getTheme();
        const app = document.getElementById("app");

        // Apply dynamic colors
        document.body.style.backgroundColor = theme.background;
        document.body.style.color = theme.text;

        if (state.isMapFullscreen) {
          // Fullscreen map mode
          app.innerHTML = `
          <div class="h-full w-full">
            ${renderMap()}
          </div>
        `;
        } else {
          // Normal layout
          app.innerHTML = `
          <div class="h-full w-full flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="flex-shrink-0 px-4 py-3" style="background-color: ${theme.surface}; border-bottom: 1px solid ${theme.border}">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background-color: ${config.primary_color}">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z" clip-rule="evenodd"/>
                    </svg>
                  </div>
                  <div>
                    <h1 class="font-bold text-lg" style="color: ${theme.text}">${config.app_title}</h1>
                    <p class="text-xs" style="color: ${theme.textSecondary}">${config.responder_name}</p>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <!-- Theme Toggle -->
                  <button 
                    onclick="toggleTheme()"
                    class="w-10 h-10 rounded-lg flex items-center justify-center transition-all hover:scale-105"
                    style="background-color: ${theme.surfaceAlt}; color: ${theme.text}"
                    title="Toggle ${state.isDarkMode ? "Light" : "Dark"} Mode"
                  >
                    ${
                      state.isDarkMode
                        ? `
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                      </svg>
                    `
                        : `
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                      </svg>
                    `
                    }
                  </button>
                  
                  ${
                    state.activeIncident
                      ? `
                    <span class="${STATUS_COLORS[state.currentStatus]} px-3 py-1 rounded-full text-xs font-bold animate-pulse">
                      ${state.currentStatus}
                    </span>
                  `
                      : `
                    <span class="px-3 py-1 rounded-full text-xs font-bold" style="background-color: ${theme.surfaceAlt}; color: ${theme.text}">
                      Available
                    </span>
                  `
                  }
                </div>
              </div>
            </header>
            
            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-4 space-y-4">
              ${renderMap()}
              ${renderIncidentDetails()}
              ${renderStatusTracker()}
              ${renderResponderReport()}
              ${renderActionBar()}
            </main>
          </div>
          
          ${state.showIncomingModal ? renderIncomingModal() : ""}
          ${state.showChat ? renderChatModal() : ""}
          ${state.showHistory ? renderHistoryModal() : ""}
        `;
        }
      }

      // ==================== INITIALIZE ====================
      document.addEventListener("DOMContentLoaded", () => {
        renderApp();
      });
    </script>
